name: daily-pipeline
on:
  schedule:
    - cron: "30 21 * * *"        # daily, 21:30 UTC (after US close)
  workflow_dispatch:
    inputs:
      evolve:
        description: "Force the Strategy Lab to search + evolve now (ignores weekday schedule)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: dashqv2-pipeline-state
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_PAPER: "true"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SENTIMENT_BACKEND: "vader"
        run: |
          ARGS="--config universe.json"
          if [ "${{ github.event.inputs.evolve }}" = "true" ]; then
            ARGS="$ARGS --evolve"
          fi
          python -m src.pipeline $ARGS
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/latest_signals.json data/snapshots.csv data/journal.db \
                   models/champion_genome.json models/champion.joblib \
                   models/champion_genome.prev.json models/champion.prev.joblib; do
            git add "$f" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "chore: daily pipeline artifacts [skip ci]"
          git pull --rebase origin main || true
          git push
