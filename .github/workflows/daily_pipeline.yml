name: daily-pipeline
on:
  schedule:
    # GitHub cron is best-effort: runs have landed 1.5-2.5 h late. Off-round minutes queue a bit
    # faster; the pipeline dates every run by its trading SESSION (not the UTC clock), and the
    # backup cron re-runs only if the main one never produced an after-close run (--skip-if-done).
    - cron: "37 21 * * *"        # main, after the US close
    - cron: "23 1 * * *"         # backup, same session (before the next US open)
  workflow_dispatch:
    inputs:
      evolve:
        description: "Force the Strategy Lab to search + evolve now (ignores weekday schedule)"
        type: boolean
        default: false
      trade:
        description: "Rebalance the paper account"
        type: boolean
        default: true
      promote_genome:
        description: "Genome JSON to install as champion first (sent by the Streamlit Lab)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: dashqv2-pipeline-state
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore daily-bar cache (only the last few days get downloaded)
        uses: actions/cache@v4
        with:
          path: .cache/bars
          key: bars-v1-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            bars-v1-${{ github.workflow }}-
      - name: Run pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_PAPER: "true"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SENTIMENT_BACKEND: "vader"
          BARS_CACHE_DIR: ".cache/bars"
          EVENT: ${{ github.event_name }}
          EVOLVE: ${{ github.event.inputs.evolve }}
          TRADE: ${{ github.event.inputs.trade }}
          PROMOTE_GENOME: ${{ github.event.inputs.promote_genome }}
        run: |
          ARGS="--config universe.json"
          if [ "$EVENT" = "schedule" ]; then ARGS="$ARGS --skip-if-done"; fi
          if [ "$EVOLVE" = "true" ]; then ARGS="$ARGS --evolve"; fi
          if [ "$TRADE" = "false" ]; then ARGS="$ARGS --no-trade"; fi
          python -m src.pipeline $ARGS --promote-genome "$PROMOTE_GENOME"
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/latest_signals.json data/snapshots.csv data/journal.db data/sentiment.csv \
                   models/champion_genome.json models/champion.joblib \
                   models/champion_genome.prev.json models/champion.prev.joblib; do
            git add "$f" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "chore: daily pipeline artifacts [skip ci]"
          git pull --rebase origin main || true
          git push
