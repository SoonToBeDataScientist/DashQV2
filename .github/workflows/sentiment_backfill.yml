name: sentiment-backfill
# One-off: build data/sentiment.csv from Alpaca's news archive so sentiment has real history to
# train on. Until the store spans evolution.sentiment_min_days, the pipeline keeps sentiment off.
# Afterwards the daily pipeline tops it up (last 7 days) on every run.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of news history to scan (1460 = the 4-year training panel)"
        type: string
        default: "1460"
permissions:
  contents: write
concurrency:
  group: dashqv2-pipeline-state
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DAYS: ${{ github.event.inputs.days }}
        run: python -m src.pipeline --config universe.json --backfill-sentiment "$DAYS"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sentiment.csv
          git diff --cached --quiet || git commit -m "chore: sentiment backfill [skip ci]"
          git pull --rebase origin main || true
          git push
